# ========================================
# CONFIGURACIÓN DE PRODUCCIÓN
# ========================================

# Base de datos PostgreSQL (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dcim_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dcim_db_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool optimizado para contenedores
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

# Deshabilitar logs de SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Dialecto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DDL auto en producción
spring.jpa.hibernate.ddl-auto=update

# Deshabilitar import.sql en producción
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Optimizaciones de rendimiento
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Sesión: 8 horas de inactividad antes de expirar
server.servlet.session.timeout=480m

# Actuator - Health endpoint para Koyeb
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging simplificado
logging.level.root=INFO
logging.level.com.example.clases=INFO
