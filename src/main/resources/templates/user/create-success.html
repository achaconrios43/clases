<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/headers :: headers}"></head>
<body class="min-h-screen flex flex-col" style="font-family:'Barlow',sans-serif; color:#172134; background: radial-gradient(circle at 8% 12%, rgba(11,60,117,0.08), transparent 32%), radial-gradient(circle at 94% 5%, rgba(0,164,200,0.12), transparent 28%), linear-gradient(180deg,#edf3f9 0%,#e6edf5 55%,#dfe9f3 100%);">
<nav th:replace="~{fragments/navdar :: nav}"></nav>

<!-- Page Header -->
<div style="background:linear-gradient(90deg,#0f4c75,#1b6ca8); padding:22px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
  <a href="/user/list" style="color:rgba(255,255,255,0.75); font-size:13px; text-decoration:none; font-weight:600;">← Usuarios</a>
  <span style="color:rgba(255,255,255,0.4);">/</span>
  <span style="color:#ffffff; font-weight:800; font-size:15px;">✅ Usuario Creado</span>
</div>

<main class="flex-1" style="padding:40px 24px; max-width:600px; margin:0 auto; width:100%; box-sizing:border-box;">
  <div style="background:#fff; border-radius:14px; border:1px solid rgba(11,60,117,0.08); box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:36px; text-align:center;">
    <div style="font-size:3rem; margin-bottom:16px;">✅</div>
    <h1 style="font-size:1.5rem; font-weight:800; color:#0f4c75; margin:0 0 8px;">¡Usuario Creado!</h1>
    <p style="color:#64748b; font-size:.9rem; margin:0 0 28px;">El usuario se ha registrado correctamente.</p>

    <div style="background:#f0f7ff; border:1px solid #bfdbfe; border-radius:10px; padding:16px; text-align:left; margin-bottom:28px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:.875rem;">
        <div><span style="color:#64748b; font-weight:600;">Email:</span><br><span style="color:#0f4c75; font-weight:700;" th:text="${usuario.email}">email@example.com</span></div>
        <div><span style="color:#64748b; font-weight:600;">Rol:</span><br><span style="color:#0f4c75; font-weight:700;" th:text="${usuario.rol}">USER</span></div>
      </div>
    </div>

    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <a href="/user/list" style="background:linear-gradient(90deg,#0f4c75,#1b6ca8); color:#fff; padding:9px 20px; border-radius:8px; font-size:.875rem; font-weight:600; text-decoration:none;">Ver lista de usuarios</a>
      <a href="/user/create" style="background:rgba(15,76,117,0.08); color:#0f4c75; border:1px solid rgba(15,76,117,0.2); padding:9px 20px; border-radius:8px; font-size:.875rem; font-weight:600; text-decoration:none;">Crear otro usuario</a>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
