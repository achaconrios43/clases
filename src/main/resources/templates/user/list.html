<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/headers :: headers}"></head>
  <body class="min-h-screen flex flex-col" style="font-family:'Barlow',sans-serif; color:#172134; background: radial-gradient(circle at 8% 12%, rgba(11,60,117,0.08), transparent 32%), radial-gradient(circle at 94% 5%, rgba(0,164,200,0.12), transparent 28%), linear-gradient(180deg,#edf3f9 0%,#e6edf5 55%,#dfe9f3 100%);">
    <nav th:replace="~{fragments/navdar :: nav}"></nav>

<!-- Page Header -->
<div style="background:linear-gradient(90deg,#0f4c75,#1b6ca8); padding:22px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
  <div style="display:flex; align-items:center; gap:16px;">
    <a href="/dashboard" style="color:rgba(255,255,255,0.75); font-size:13px; text-decoration:none; font-weight:600;">← Dashboard</a>
    <span style="color:rgba(255,255,255,0.4);">/</span>
    <span style="color:#ffffff; font-weight:800; font-size:15px;">👤 Usuarios</span>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <a href="/user/create" style="background:rgba(255,255,255,0.18); color:#fff; border:1px solid rgba(255,255,255,0.35); padding:7px 16px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none;">+ Crear Usuario</a>
  </div>
</div>

<main class="flex-1" style="padding:28px 24px; max-width:1200px; margin:0 auto; width:100%; box-sizing:border-box;">
      <div style="background:#fff; border-radius:14px; border:1px solid rgba(11,60,117,0.08); box-shadow:0 2px 8px rgba(0,0,0,0.06); padding:24px; overflow-x:auto;">
        <table class="min-w-full table-auto border-collapse" style="font-size:14px;">
          <thead>
            <tr class="bg-gray-100">
              <th class="px-4 py-2 text-left">#</th>
              <th class="px-4 py-2 text-left">Nombre</th>
              <th class="px-4 py-2 text-left">Apellido</th>
              <th class="px-4 py-2 text-left">Email</th>
              <th class="px-4 py-2 text-left">RUT</th>
              <th class="px-4 py-2 text-left">Contraseña</th>
              <th class="px-4 py-2 text-left">Rol</th>
              <th class="px-4 py-2 text-left">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u, iterStat : ${usuarios}">
              <td class="px-4 py-2" th:text="${iterStat.count}">1</td>
              <td class="px-4 py-2" th:text="${u.nombre}">Nombre</td>
              <td class="px-4 py-2" th:text="${u.apellido}">Apellido</td>
              <td class="px-4 py-2" th:text="${u.email}">email@example.com</td>
              <td class="px-4 py-2" th:text="${u.rut}">rut</td>
              <td class="px-4 py-2">******</td>
              <td class="px-4 py-2">
                <span th:text="${u.rol}" th:classappend="${u.rol == 'ADMIN'} ? ' text-red-600 font-semibold' : (${u.rol == 'VIEWER'} ? ' text-orange-600 font-semibold' : ' text-gray-700')">ROLE</span>
              </td>
              <td class="px-4 py-2 flex items-center gap-3">
                <!-- Edit icon -->
                <a th:href="@{'/user/update/' + ${u.id}}" title="Editar" class="text-[#003DA5] hover:text-[#005ea8]">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                </a>
                <!-- Delete icon -->
                <a th:href="@{'/user/delete/' + ${u.id}}" title="Eliminar" class="text-red-600 hover:text-red-800" onclick="return confirm('¿Eliminar usuario?');">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m5 0V4a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script>
      function goToIngreso(btn){
        if(!btn) return;
        const nombre = btn.getAttribute('data-nombre') || '';
        const rut = btn.getAttribute('data-rut') || '';
        const url = '/ingreso?nombre=' + encodeURIComponent(nombre) + '&rut=' + encodeURIComponent(rut);
        window.location.href = url;
      }
    </script>
  </body>
</html>
